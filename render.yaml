# ============================================================================
# ReTrac Infrastructure as Code — Render Blueprint (render.yaml)
# DOMINION 2026 — Track 05: Rehabilitation & Reintegration
# ============================================================================

databases:
  - name: retrac-database
    databaseName: retrac_db
    user: retrac_user
    plan: free
    region: frankfurt

services:
  # 1. Backend REST API Web Service
  - type: web
    name: retrac-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: retrac-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_MODE
        value: "true"
      - key: SMS_PROVIDER
        value: "demo"
      - key: AI_PROVIDER
        value: "demo"
      - key: PAYMENT_PROVIDER
        value: "demo"
      - key: FRONTEND_URL
        value: https://retrac.onrender.com

  # 2. Frontend React / Vite Static Site
  - type: web
    name: retrac-frontend
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://retrac-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Weekly Automated Check-in Cron Trigger
  - type: cron
    name: retrac-weekly-checkin-cron
    runtime: node
    plan: free
    region: frankfurt
    schedule: "0 9 * * 1" # Every Monday at 9:00 AM UTC (12:00 PM EAT)
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/scripts/triggerCronCheckins.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_INTERNAL_URL
        value: https://retrac-backend.onrender.com
      - key: CRON_SECRET
        value: retrac_internal_cron_secret_key_2026
