version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retrac_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: retrac_db
    ports:
      - "5432:5432"
    volumes:
      - retrac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retrac_backend
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/retrac_db
      JWT_SECRET: retrac_jwt_super_secret_session_key_2026_dominion
      DEMO_MODE: "true"
      SMS_PROVIDER: "demo"
      AI_PROVIDER: "demo"
      PAYMENT_PROVIDER: "demo"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retrac_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  retrac_pgdata:
